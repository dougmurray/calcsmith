name: Calcsmith
options:
  bundleIdPrefix: com.douglassmurray
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  Calcsmith:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Calcsmith
    PRODUCT_NAME: Calcsmith
targets:
  Calcsmith-macOS:
    type: application
    platform: macOS
    sources: [Apps/macOS]
    dependencies:
      - package: Calcsmith
        product: CalcsmithUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.douglassmurray.calcsmith
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
  Calcsmith-iOS:
    type: application
    platform: iOS
    sources: [Apps/iOS]
    dependencies:
      - package: Calcsmith
        product: CalcsmithUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.douglassmurray.calcsmith
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Automatic
